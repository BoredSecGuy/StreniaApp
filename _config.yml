app_icon: # assets/appicon.png                      # Automatically populates if not set and if iOS app ID is set.  Otherwise enter path to icon file manually.
app_name: # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_price: # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_description: Strenia is a powerful fitness tracking app designed for serious strength training. What makes us different? A beautiful, intuitive design that allows you to focus on your lift. With customizable routines and a robust exercise library, Strenia provides everything you need to optimize your strength training in a sleek, modern interface. You should be focused on your workout, not your tracking.

enable_smart_app_banner: true # Set to true to show a smart app banner at top of page on mobile devices.

# Information About Yourself
your_name: Wes Dorman
email_address: streniaapp@gmail.com

# Feature List                            Edit, add or remove features to be presented.
features:
  - title: 14-Day Free Trial
    description: Try all features completely free for 14 days. No credit card required.
    fontawesome_icon_name: clock

  - title: Flexible Pricing Options
    description: Choose what works best for you - monthly ($0.99), annual ($9.99), or lifetime access ($14.99).
    fontawesome_icon_name: dollar-sign

  - title: Comprehensive Workout Tracking
    description: Track all your exercises, sets, reps, and weights with precision. Monitor your progress and see your strength gains in real-time.
    fontawesome_icon_name: dumbbell

  - title: Visual Progress Charts
    description: Beautiful, intuitive charts visualize your strength gains over time. Easily identify trends and see your improvements at a glance.
    fontawesome_icon_name: chart-line

  - title: Workout History & Calendar
    description: Navigate your entire workout history through an elegant calendar view. Quickly access past workouts by date with a single tap.
    fontawesome_icon_name: calendar-alt

  - title: Personal Record Tracking
    description: Automatically detect and celebrate new PRs. Keep a comprehensive history of all your personal bests for each exercise.
    fontawesome_icon_name: trophy

  - title: Customizable Routines
    description: Create and save your favorite workout routines. Quickly start your next session with your personalized exercise plan.
    fontawesome_icon_name: list-alt

  - title: Robust Exercise Library
    description: Access a comprehensive database of exercises with proper form guidance. Add custom exercises to suit your specific training needs.
    fontawesome_icon_name: book

  - title: iCloud Backup
    description: Never lose your workout data with automatic iCloud backup. Seamlessly transition between devices while keeping all your history.
    fontawesome_icon_name: cloud

  - title: Privacy Focused
    description: Your fitness data stays on your device. We don't track you or sell your information to third parties.
    fontawesome_icon_name: shield-alt

